Global:
  device: gpu
  epoch_num: 3
  log_smooth_window: 20
  print_batch_step: 50
  output_dir: /content/drive/MyDrive/svtrv2x_checkpoints/mixed_latin_indic_tiny_run2_tier1
  save_epoch_step: [0, 1]
  eval_batch_step: [0, 2000]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: True
  pretrained_model:
  checkpoints:
  use_tensorboard: false
  infer_img:
  character_dict_path: &character_dict_path ./tools/utils/mixed_latin_indic_dict.txt
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char False
  save_res_path: ./output/rec/predicts_svtrv2x_tiny_mixed_latin_indic_run2_tier1.txt
  use_amp: True
  grad_clip_val: 5.0

Optimizer:
  name: AdamW
  lr: 0.00065
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 0.5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: SVTRv2X
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRv2X_Tier1
    use_se_stem: True
    use_2d_pos_embed: True
    se_reduction: 4
    use_pos_embed: False
    dims: [64, 128, 256]
    depths: [3, 6, 3]
    num_heads: [2, 4, 8]
    mixer: [['Conv','Conv','Conv'],['Conv','Conv','Conv','FGlobal','Global','Global'],['Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: false
    feat2d: True
    use_jumble: True
    jumble_patch_size: 4
    jumble_ratio: 0.1
    use_moe: True
    moe_num_experts: 4
    moe_topk: 1
    use_self_distill: True
    sdm_shared_dim: 128
  Decoder:
    name: GTCDecoder
    infer_gtc: True
    detach: False
    gtc_decoder:
      name: SMTRDecoder
      num_layer: 1
      ds: True
      max_len: *max_text_length
      next_mode: &next True
      sub_str_len: &subsl 5
    ctc_decoder:
      name: RCTCDecoder

Loss:
  name: SVTRv2XLoss
  ctc_weight: 0.1
  gtc_weight: 1.0
  sdm_weight: 0.5
  moe_weight: 0.01
  gtc_loss:
    name: SMTRLoss

PostProcess:
  name: GTCLabelDecode
  gtc_label_decode:
    name: SMTRLabelDecode
    next_mode: *next
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecGTCMetric
  main_indicator: acc

Train:
  dataset:
    name: MixedScriptRatioDataSet
    ds_width: True
    padding: false
    # 60% Union14M-L (Latin)
    latin_data_dir_list: [
      'Union14M-L-LMDB-Filtered/filter_train_challenging',
      'Union14M-L-LMDB-Filtered/filter_train_hard',
      'Union14M-L-LMDB-Filtered/filter_train_medium',
      'Union14M-L-LMDB-Filtered/filter_train_normal',
      'Union14M-L-LMDB-Filtered/filter_train_easy'
    ]
    # 40% IndicSTR12 (Indic)
    indic_data_dir_list: [
      'IndicSTR12/indicstr12_lmdb'
    ]
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - PARSeqAugPIL:
      - GTCLabelEncode:
          gtc_label_encode:
            name: SMTRLabelEncode
            sub_str_len: *subsl
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'label_subs', 'label_next', 'length_subs',
          'label_subs_pre', 'label_next_pre', 'length_subs_pre', 'length', 'ctc_label', 'ctc_length']
  sampler:
    name: MixedScriptRatioSampler
    scales: [[128, 32]]
    first_bs: &bs 64
    latin_ratio: 0.60
    is_training: True
  loader:
    shuffle: True
    batch_size_per_card: *bs
    drop_last: True
    max_ratio: &max_ratio 8
    num_workers: 2

Eval:
  dataset:
    name: RatioDataSetTVResize
    ds_width: True
    padding: False
    data_dir_list: [
      'evaluation/CUTE80',
      'evaluation/SVTP'
    ]
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - GTCLabelEncode:
          gtc_label_encode:
            name: ARLabelEncode
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'ctc_label', 'ctc_length']
  sampler:
    name: RatioSampler
    scales: [[128, 32]]
    first_bs: *bs
    fix_bs: false
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: *bs
    max_ratio: *max_ratio
    num_workers: 2
